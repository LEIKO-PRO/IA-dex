<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zanmi IA</title>
<style>
body {
  font-family: Arial;
  background: #101827;
  color: white;
  text-align: center;
  padding: 20px;
}
h1 { color: #00e5ff; }
#chat {
  background: #202c40;
  padding: 15px;
  border-radius: 12px;
  min-height: 250px;
  text-align: left;
}
input {
  padding: 12px;
  width: 65%;
  border-radius: 8px;
}
button {
  padding: 12px;
  background: #00c8ff;
  border: none;
  border-radius: 8px;
}
</style>
</head>
<body>

<h1>🤖 ZANMI IA</h1>
<p>Bonjou! Mwen se Zanmi IA. Pale avè m!</p>

<div id="chat"></div>

<br>
<input id="msg" placeholder="Ekri mesaj ou...">
<button onclick="send()">Voye</button>

<script>
function send() {
 let input = document.getElementById("msg");
 let chat = document.getElementById("chat");
 let message = input.value.trim();

 if (message === "") return;

 chat.innerHTML += "<p><b>Ou:</b> " + message + "</p>";

 let answer = "Mwen kontan pale avè w! 😊";

 if (message.toLowerCase().includes("bonjou")) {
   answer = "Bonjou zanmi! Kijan ou ye? 😊";
 }

 chat.innerHTML += "<p><b>Zanmi IA:</b> " + answer + "</p>";
 input.value = "";
}
</script>

</body>
</html>
